services:
  - type: web
    name: freebuff-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-frontend.onrender.com"
      - key: SUMO_HOME
        value: "/usr/share/sumo"
    healthCheckPath: /health
    autoDeploy: true
